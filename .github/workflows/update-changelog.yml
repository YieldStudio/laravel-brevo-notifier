name: "Update Changelog"

on:
  release:
    types: [ released ]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG to a dedicated branch
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update CHANGELOG for ${{ github.event.release.name }}"
          file_pattern: CHANGELOG.md
          branch: changelog/${{ github.event.release.tag_name }}
          create_branch: true

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "changelog/${{ github.event.release.tag_name }}" \
            --title "Update CHANGELOG for ${{ github.event.release.name }}" \
            --body "Automated CHANGELOG update for [${{ github.event.release.name }}](${{ github.event.release.html_url }})."
